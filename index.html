<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>家庭點數</title>

  <link rel="apple-touch-icon" sizes="180x180" href="https://cdn.jsdelivr.net/gh/hsiaotong/csdi-assets@main/family-icon.jpg">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://cdn.jsdelivr.net/gh/hsiaotong/csdi-assets@main/family-icon.jpg">
  <link rel="icon" type="image/jpeg" href="https://cdn.jsdelivr.net/gh/hsiaotong/csdi-assets@main/family-icon.jpg">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="家庭點數">
  <meta name="theme-color" content="#ffffff">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .icon {
      width: 80px;
      height: 80px;
      border-radius: 18px;
      margin: 0 auto 20px;
      display: block;
    }
    h1 { font-size: 22px; color: #1a1a1a; margin-bottom: 8px; }
    p { font-size: 15px; color: #666; line-height: 1.6; margin-bottom: 28px; }
    .steps {
      text-align: left;
      background: #f9f9f9;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
    }
    .step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 14px;
      color: #444;
      line-height: 1.5;
    }
    .step:last-child { margin-bottom: 0; }
    .step-num {
      background: #4A90D9;
      color: white;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: #4A90D9;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="icon" src="https://cdn.jsdelivr.net/gh/hsiaotong/csdi-assets@main/family-icon.jpg" alt="家庭點數">
    <h1>家庭點數系統</h1>
    <p>請將此頁面加入主畫面，之後就能直接從圖示開啟！</p>
    <div class="steps">
      <div class="step">
        <div class="step-num">1</div>
        <div>點下方工具列的 <strong>分享</strong> 按鈕（方框加箭頭圖示）</div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div>選擇 <strong>「加入主畫面」</strong></div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div>點右上角 <strong>「新增」</strong></div>
      </div>
    </div>
    <a class="btn" href="https://script.google.com/a/macros/hrd.gov.tw/s/AKfycbyq7q-AJ3dSx6NxVjbjmyGjQh_aUM2eW8ej5WCumRU1_CXx8EVwbdrxK7I8HtclLkjT/exec">直接開啟系統</a>
  </div>

  <script>
    // 從主畫面圖示開啟時，直接跳轉
    if (window.navigator.standalone) {
      window.location.href = "https://script.google.com/a/macros/hrd.gov.tw/s/AKfycbyq7q-AJ3dSx6NxVjbjmyGjQh_aUM2eW8ej5WCumRU1_CXx8EVwbdrxK7I8HtclLkjT/exec";
    }
  </script>
</body>
</html>
